name: Build Serene Home APK

# This workflow builds an installable debug APK for Xiaomi Mi TV A2 (Android TV 10).
# android-actions/setup-android@v4 avoids requesting the removed Android SDK 'tools' package.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Android TV APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (no deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 35 and Build Tools 35.0.0
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check app matching rules
        run: |
          mkdir -p "$RUNNER_TEMP/serene-tests"
          javac -d "$RUNNER_TEMP/serene-tests" app/src/main/java/ru/family/serenehome/AppMatcher.java tools/TestMatcher.java
          java -cp "$RUNNER_TEMP/serene-tests" ru.family.serenehome.TestMatcher

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: serene-home-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
